name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: veupathdb-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The lock names the client library and nothing else, so a `pathfinder`
      # import fails to resolve here rather than failing a lint rule.
      - name: Install the package alone
        run: uv sync --frozen

      - name: Run ruff
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Run mypy
        run: uv run mypy --strict src

      - name: Run the hermetic suite
        run: uv run pytest tests/unit

      # The index suite starts a pgvector container and runs this package's own
      # alembic chain on it.
      - name: Run the index suite
        run: uv run pytest tests/integration

      # The checkouts the citation check reads are not present here, so a
      # citation of another repository is reported as unverified, not failed.
      - name: Check the knowledge bundle
        run: |
          node scripts/check-knowledge.mjs
          node --test scripts/check-knowledge.test.mjs

  research-conformance:
    name: Research server admission
    runs-on: ubuntu-latest
    env:
      RESEARCH_MCP_BASE_URL: http://localhost:8110
      # The suite reads the endpoint and the credential from the environment,
      # so the lane writes the secret once and the server admits that one.
      MCP_CONFORMANCE_ENDPOINT: http://localhost:8110/mcp
      MCP_CONFORMANCE_BEARER: research-mcp-conformance-secret-0123456789
      CONFORMANCE: veupathdb-mcp-conformance @ git+https://github.com/VEuPathDB/ai-assistant-platform@v0.3.0a5#subdirectory=packages/mcp-conformance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"

      - name: Install the package alone
        run: uv sync --frozen

      # The research server holds no site, no database and no account, so its
      # admission run needs nothing but the server itself.
      - name: Serve veupathdb-research-mcp
        run: |
          RESEARCH_MCP_SERVICE_TOKENS="ci:$MCP_CONFORMANCE_BEARER" \
            uv run python -m veupathdb_mcp.research > research-mcp.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8110/health; then
              exit 0
            fi
            sleep 1
          done
          cat research-mcp.log
          echo "veupathdb-research-mcp did not answer /health" >&2
          exit 1

      - name: Run the conformance suite
        run: >
          uv run --with "$CONFORMANCE" pytest --pyargs mcp_conformance -q -rs
          --mcp-report admission-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: research-admission-report
          path: admission-report.json

  wdk-conformance:
    name: WDK server admission
    runs-on: ubuntu-latest
    env:
      WDK_MCP_BASE_URL: http://localhost:8100
      MCP_CONFORMANCE_ENDPOINT: http://localhost:8100/mcp
      MCP_CONFORMANCE_BEARER: wdk-mcp-conformance-secret-0123456789ab
      CONFORMANCE: veupathdb-mcp-conformance @ git+https://github.com/VEuPathDB/ai-assistant-platform@v0.3.0a5#subdirectory=packages/mcp-conformance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"

      - name: Install the package alone
        run: uv sync --frozen

      # A service secret is issued by the deployment that serves, so this lane
      # needs no VEuPathDB account. The server preloads no catalog and opens no
      # database, and the suite calls no tool with arguments a site would have
      # to answer, so the lane reaches no site.
      - name: Serve veupathdb-wdk-mcp
        run: |
          WDK_MCP_SERVICE_TOKENS="ci:$MCP_CONFORMANCE_BEARER" \
            uv run python -m veupathdb_mcp > wdk-mcp.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8100/health; then
              exit 0
            fi
            sleep 1
          done
          cat wdk-mcp.log
          echo "veupathdb-wdk-mcp did not answer /health" >&2
          exit 1

      - name: Run the conformance suite
        run: >
          uv run --with "$CONFORMANCE" pytest --pyargs mcp_conformance -q -rs
          --mcp-report admission-report.json

      - uses: actions/upload-artifact@v4
        with:
          name: wdk-admission-report
          path: admission-report.json

  live:
    name: Live site lane
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
      - name: Install the package alone
        run: uv sync --frozen
      - name: Run the live lane
        run: uv run pytest tests/live -m live_wdk --override-ini addopts=''
